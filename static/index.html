<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support CRM · Tickets</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}</style>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200">
  <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">S</div>
      <h1 class="text-lg font-semibold text-slate-800">Support CRM</h1>
    </div>
    <a href="/create" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
      + New Ticket
    </a>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6">

  <!-- Dashboard strip (stand-out feature) -->
  <div id="stats" class="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-6"></div>

  <!-- Search + filter -->
  <div class="flex flex-col sm:flex-row gap-3 mb-4">
    <input id="search" type="text" placeholder="Search by name, ticket ID, email, or description…"
      class="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    <select id="statusFilter" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <option value="">All statuses</option>
      <option value="Open">Open</option>
      <option value="In Progress">In Progress</option>
      <option value="Closed">Closed</option>
    </select>
  </div>

  <div class="bg-white border border-slate-200 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wide">
        <tr>
          <th class="text-left px-4 py-3">ID</th>
          <th class="text-left px-4 py-3">Customer</th>
          <th class="text-left px-4 py-3 hidden sm:table-cell">Subject</th>
          <th class="text-left px-4 py-3">Status</th>
          <th class="text-left px-4 py-3 hidden sm:table-cell">Priority</th>
          <th class="text-left px-4 py-3 hidden md:table-cell">Date</th>
        </tr>
      </thead>
      <tbody id="ticketRows" class="divide-y divide-slate-100"></tbody>
    </table>
    <div id="emptyState" class="hidden text-center text-slate-400 text-sm py-10">No tickets found.</div>
  </div>
</main>

<script src="/static/js/api.js"></script>
<script>
let debounceTimer;

async function loadStats() {
  try {
    const s = await apiGet("/stats");
    const el = document.getElementById("stats");
    const cards = [
      { label: "Total", value: s.total, color: "text-slate-800" },
      { label: "Open", value: s.open, color: "text-blue-600" },
      { label: "In Progress", value: s.in_progress, color: "text-amber-600" },
      { label: "Closed", value: s.closed, color: "text-gray-500" },
      { label: "High Priority (open)", value: s.high_priority_open, color: "text-rose-600" },
    ];
    el.innerHTML = cards.map(c => `
      <div class="bg-white border border-slate-200 rounded-xl p-3 text-center">
        <div class="text-2xl font-bold ${c.color}">${c.value}</div>
        <div class="text-xs text-slate-500 mt-1">${c.label}</div>
      </div>
    `).join("");
  } catch (e) {
    console.error(e);
  }
}

async function loadTickets() {
  const search = document.getElementById("search").value.trim();
  const status = document.getElementById("statusFilter").value;
  const params = new URLSearchParams();
  if (search) params.set("search", search);
  if (status) params.set("status", status);

  try {
    const tickets = await apiGet(`/tickets?${params.toString()}`);
    const rows = document.getElementById("ticketRows");
    const empty = document.getElementById("emptyState");

    if (tickets.length === 0) {
      rows.innerHTML = "";
      empty.classList.remove("hidden");
      return;
    }
    empty.classList.add("hidden");

    rows.innerHTML = tickets.map(t => `
      <tr class="hover:bg-slate-50 cursor-pointer" onclick="window.location.href='/ticket?id=${encodeURIComponent(t.ticket_id)}'">
        <td class="px-4 py-3 font-mono text-xs text-slate-500">${t.ticket_id}</td>
        <td class="px-4 py-3 font-medium text-slate-800">${escapeHtml(t.customer_name)}</td>
        <td class="px-4 py-3 hidden sm:table-cell text-slate-600 truncate max-w-xs">${escapeHtml(t.subject)}</td>
        <td class="px-4 py-3">
          <span class="text-xs px-2 py-1 rounded-full ${statusBadgeClasses(t.status)}">${t.status}</span>
        </td>
        <td class="px-4 py-3 hidden sm:table-cell">
          <span class="text-xs px-2 py-1 rounded-full ${priorityBadgeClasses(t.priority)}">${t.priority}</span>
        </td>
        <td class="px-4 py-3 hidden md:table-cell text-slate-500 text-xs">${fmtDate(t.created_at)}</td>
      </tr>
    `).join("");
  } catch (e) {
    console.error(e);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById("search").addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadTickets, 250); // "search bar works as you type"
});
document.getElementById("statusFilter").addEventListener("change", loadTickets);

loadStats();
loadTickets();
</script>
</body>
</html>
